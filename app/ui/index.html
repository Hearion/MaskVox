<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>MaskVox</title>
  <link rel="stylesheet" href="app.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand-name">MaskVox</span>
      <span class="brand-tag">实时变声器</span>
    </div>
    <div class="topbar-actions">
      <button type="button" class="chip" id="cable-chip" hidden></button>
      <button type="button" class="icon-button" id="open-settings" aria-label="设置" title="设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <main class="workspace">
    <section class="effects" aria-labelledby="effects-title">
      <div class="guide" id="guide" hidden>
        <ol>
          <li><b>1</b>安装 VB-Cable</li>
          <li><b>2</b>选音效，打开开关</li>
          <li><b>3</b>聊天软件的麦克风选 CABLE Output</li>
        </ol>
        <button type="button" class="text-button" id="dismiss-guide">知道了</button>
      </div>
      <div class="section-head">
        <h1 id="effects-title">音效</h1>
        <p>随时切换，变声不会中断</p>
      </div>
      <div class="effect-grid" id="effect-grid" role="radiogroup" aria-labelledby="effects-title"></div>
    </section>

    <aside class="console">
      <section class="card power-card">
        <button type="button" class="power" id="power" aria-pressed="false" aria-label="开始变声">
          <span class="power-ring" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8M6.3 6.6a8 8 0 1 0 11.4 0"/></svg>
        </button>
        <div class="power-text">
          <strong id="power-title">点击开始变声</strong>
          <span id="power-subtitle">当前音效：原声</span>
        </div>
        <div class="meters">
          <div class="meter"><span>输入</span><div class="meter-track"><i id="meter-in"></i></div></div>
          <div class="meter"><span>输出</span><div class="meter-track"><i id="meter-out"></i></div></div>
        </div>
      </section>

      <section class="card tune-card" aria-labelledby="tune-title">
        <div class="card-head">
          <h2 id="tune-title">微调</h2>
          <button type="button" class="text-button" id="reset-tune">还原</button>
        </div>
        <label class="slider" data-param="pitch">
          <span class="slider-row"><span>音调</span><output></output></span>
          <input type="range" min="-12" max="12" step="0.5" value="0">
        </label>
        <label class="slider" data-param="formant">
          <span class="slider-row"><span>音色粗细</span><output></output></span>
          <input type="range" min="-12" max="12" step="0.5" value="0">
        </label>
        <label class="slider" data-param="echo">
          <span class="slider-row"><span>回声</span><output></output></span>
          <input type="range" min="0" max="1" step="0.05" value="0">
        </label>
        <label class="slider" data-param="reverb">
          <span class="slider-row"><span>混响</span><output></output></span>
          <input type="range" min="0" max="1" step="0.05" value="0">
        </label>
      </section>
    </aside>
  </main>

  <footer class="statusbar">
    <span class="status"><i class="status-dot" id="status-dot"></i><span id="status-text">未启动</span></span>
    <span class="status-detail" id="status-detail"></span>
    <span class="status-version" id="version"></span>
  </footer>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-labelledby="drawer-title" hidden>
    <div class="drawer-head">
      <h2 id="drawer-title">设置</h2>
      <button type="button" class="icon-button" id="close-settings" aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body">
      <div class="field">
        <label for="input-device">麦克风</label>
        <select id="input-device" data-device="input_id"></select>
      </div>
      <div class="field">
        <label for="output-device">输出到</label>
        <select id="output-device" data-device="output_id"></select>
        <p class="field-hint" id="output-hint"></p>
      </div>
      <div class="field">
        <div class="field-row">
          <label for="monitor">自己监听</label>
          <input type="checkbox" class="switch" id="monitor">
        </div>
        <p class="field-hint">在耳机里听到变声后的自己。请戴耳机，否则会有回声。</p>
        <select id="monitor-device" data-device="monitor_id" aria-label="监听设备"></select>
      </div>
      <label class="slider" data-param="monitor_volume">
        <span class="slider-row"><span>监听音量</span><output></output></span>
        <input type="range" min="0" max="1" step="0.01" value="0.6">
      </label>
      <label class="slider" data-param="gate_db">
        <span class="slider-row"><span>噪声门</span><output></output></span>
        <input type="range" min="-60" max="-20" step="1" value="-50">
      </label>
      <p class="field-hint">不说话时自动静音。字头被吞就往左调，环境吵就往右调。</p>
      <div class="drawer-actions">
        <button type="button" class="button" id="refresh-devices">刷新设备</button>
        <button type="button" class="button" id="open-logs">打开日志</button>
      </div>
    </div>
  </aside>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
